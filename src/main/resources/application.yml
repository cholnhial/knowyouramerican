spring:
  application:
    name: knowyouramerican
  main:
    banner-mode: off
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # Content-hashed URLs for assets linked via @{...} in templates (app-<md5>.css). nginx caches
      # /css, /js, /img for 7 days; without versioning a deploy would leave browsers on stale CSS.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/img/**

kya:
  db:
    # SQLite file. Parent directories are created on startup.
    path: ${KYA_DB_PATH:./data/kya.db}

server:
  port: ${PORT:8080}
  compression:
    enabled: true

logging:
  level:
    com.knowyouramerican: INFO
