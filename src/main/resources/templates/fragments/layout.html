<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- <head> contents shared by every page -->
<th:block th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:text="${title}">Know Your American</title>
  <meta name="description" content="Five American idioms a day. How well do you know your American?">
  <meta name="theme-color" content="#1E2A44">
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/htmx.min.js" defer></script>
  <script src="/js/game.js" defer></script>
</th:block>

<!-- Full-bleed background photo + caption -->
<th:block th:fragment="background(bg)">
  <div class="fixed inset-0 -z-10">
    <img th:src="${bg.imageUrl()}" src="/img/bg/grand-canyon.webp" alt=""
         class="h-full w-full object-cover" fetchpriority="high">
    <div class="absolute inset-0 bg-gradient-to-b from-ink/25 via-transparent to-ink/50"></div>
  </div>
  <p class="fixed bottom-2 right-3 z-0 text-[11px] text-white/85 drop-shadow">
    <span aria-hidden="true">📍</span>
    <span th:text="${bg.title + ', ' + bg.location}">Grand Canyon, Arizona</span>
    · <a th:href="${bg.sourceUrl}" class="underline decoration-white/40 hover:decoration-white"
         target="_blank" rel="noopener" th:text="${bg.credit + ' · ' + bg.license}">credit</a>
  </p>
</th:block>

<!-- Top of the card: wordmark + nav -->
<header th:fragment="header(active)" class="flex items-center justify-between gap-4">
  <a href="/" class="group flex items-center gap-2.5">
    <!-- Temporary mark until the Liberty logo is designed (round 6) -->
    <span class="grid size-9 shrink-0 place-items-center rounded-full bg-liberty text-lg text-white shadow-sm"
          aria-hidden="true">✦</span>
    <span class="font-display text-xl leading-none font-semibold tracking-tight text-ink">
      Know Your <span class="text-liberty-deep">American</span>
    </span>
  </a>
  <nav class="flex gap-1 text-sm font-medium">
    <a href="/" th:classappend="${active == 'today'} ? 'bg-ink text-paper' : 'text-slate hover:bg-mist'"
       class="rounded-full px-3 py-1.5 transition">Today</a>
    <a href="/archive" th:classappend="${active == 'archive'} ? 'bg-ink text-paper' : 'text-slate hover:bg-mist'"
       class="rounded-full px-3 py-1.5 transition">Archive</a>
  </nav>
</header>

<!-- Five progress circles + "n/5 done". Re-rendered out-of-band after each answer. -->
<div th:fragment="progress(results, oob)" id="progress"
     th:attr="hx-swap-oob=${oob} ? 'true' : null"
     class="flex items-center justify-between gap-3">
  <ol class="flex gap-2" aria-label="Progress">
    <li th:each="r, it : ${results}"
        th:attr="aria-label=${'Idiom ' + it.count + ': ' + r}"
        th:classappend="${r == 'correct'} ? 'bg-liberty border-liberty text-white animate-pop'
                       : (${r == 'missed'} ? 'bg-firework border-firework text-white animate-pop'
                       : 'bg-white/60 border-mist text-slate/60')"
        class="grid size-8 place-items-center rounded-full border-2 text-sm font-bold">
      <span th:if="${r == 'correct'}">✓</span>
      <span th:if="${r == 'missed'}">✗</span>
      <span th:if="${r == 'pending'}" th:text="${it.count}">1</span>
    </li>
  </ol>
  <p class="text-sm font-semibold text-slate">
    <span th:text="${#lists.size(results.?[#this != 'pending'])}">0</span>/5 done
  </p>
</div>

</body>
</html>
