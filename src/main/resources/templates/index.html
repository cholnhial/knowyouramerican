<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: head('Know Your American — 5 idioms a day')}"></th:block>
</head>
<body class="min-h-dvh font-sans">
  <th:block th:replace="~{fragments/layout :: background(${background})}"></th:block>

  <main class="flex min-h-dvh items-start justify-center px-3 py-6 sm:items-center sm:px-8 sm:py-16">
    <div th:replace="~{fragments/layout :: frame(~{::#game}, ${active})}">
      <!--
        Loaded over HTMX with the browser's local date and saved answers (see game.js).
        Every request from inside #game inherits hx-vals, so circles, answers and "Next" all
        carry the current answers.
      -->
      <section id="game"
               th:attr="data-date=${gameDate}, hx-get=${gameUrl}"
               hx-trigger="load"
               hx-target="#game"
               hx-swap="innerHTML"
               hx-vals='js:{a: KYA.answersFor(KYA.gameDate()), today: KYA.localDate()}'>
        <div class="flex h-56 items-center justify-center text-slate" aria-busy="true">
          <span class="animate-pulse">Loading the idioms…</span>
        </div>
        <noscript>
          <p class="text-center text-ink">Know Your American needs JavaScript turned on to play.</p>
        </noscript>
      </section>
    </div>
  </main>
</body>
</html>
