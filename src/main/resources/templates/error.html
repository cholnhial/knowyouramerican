<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: head('Know Your American')}"></th:block>
</head>
<body class="min-h-dvh font-sans">
  <th:block th:replace="~{fragments/layout :: background(null)}"></th:block>
  <main class="flex min-h-dvh items-center justify-center px-3 py-6 sm:px-8">
    <div th:replace="~{fragments/layout :: frame(~{::#oops}, 'none')}">
      <section id="oops" class="py-6 text-center">
        <p class="text-xs font-semibold tracking-widest text-liberty-deep uppercase"
           th:text="${status == 404} ? 'Not found' : 'Something went wrong'">Not found</p>
        <h1 class="mt-1 font-display text-3xl font-semibold text-ink"
            th:text="${status == 404} ? 'That’s a horse of a different color.' : 'We’re in a pickle.'">That’s a horse of a different color.</h1>
        <p class="mt-3 text-slate"
           th:text="${status == 404} ? 'There’s no puzzle there — maybe that day hasn’t come yet.' : 'Give it another shot in a moment.'">
          There’s no puzzle there.</p>
        <div class="mt-6 flex justify-center gap-2 text-sm font-semibold">
          <a href="/" class="rounded-full bg-liberty-deep px-5 py-2.5 text-white transition hover:bg-ink">Today’s five</a>
          <a href="/archive" class="rounded-full border-2 border-mist bg-white px-5 py-2.5 text-ink transition hover:border-liberty">Archive</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
