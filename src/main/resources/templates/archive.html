<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: head('Archive — Know Your American')}"></th:block>
</head>
<body class="min-h-dvh font-sans">
  <th:block th:replace="~{fragments/layout :: background(${background})}"></th:block>

  <main class="flex min-h-dvh items-start justify-center px-3 py-6 sm:items-center sm:px-8 sm:py-16">
    <div th:replace="~{fragments/layout :: frame(~{::#archive}, ${active})}">
      <section id="archive">
        <div class="mb-5 flex flex-wrap items-end justify-between gap-3">
          <div>
            <p class="text-xs font-semibold tracking-widest text-liberty-deep uppercase">The archive</p>
            <h1 class="font-display text-[1.7rem] leading-tight font-semibold text-ink sm:text-4xl">Every day so far</h1>
          </div>
          <a href="/archive/random"
             class="inline-flex items-center gap-2 rounded-full bg-torch px-4 py-2 text-sm font-semibold text-ink shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
            🎲 Random day
          </a>
        </div>
        <div th:replace="~{fragments/calendar :: calendar}"></div>
        <p class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate">
          <span class="inline-flex items-center gap-1.5"><span class="size-3 rounded bg-liberty"></span> finished</span>
          <span class="inline-flex items-center gap-1.5"><span class="size-3 rounded ring-2 ring-torch"></span> started</span>
          <span class="inline-flex items-center gap-1.5"><span class="size-3 rounded border-2 border-ink/70"></span> today</span>
        </p>
      </section>
    </div>
  </main>
</body>
</html>
