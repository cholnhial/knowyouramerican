# Know Your American — reverse proxy to the native binary on localhost.
# Appended to /etc/nginx/sites-available/default by .github/workflows/deploy.yml only if no
# "server_name kya.chol.dev" block exists yet; certbot then adds the 443 block and the
# http→https redirect. __PORT__ is replaced at deploy time.
server {
    listen 80;
    listen [::]:80;
    server_name kya.chol.dev;

    # Fingerprint-free static assets: let browsers cache them for a week.
    location ~* ^/(css|js|fonts|img)/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
